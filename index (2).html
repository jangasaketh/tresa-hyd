<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tresa — Salon &amp; Spa booking, Hyderabad</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#FAF6F4;
    --ink:#241823;
    --plum:#5B2A4E;
    --plum-deep:#3F1B37;
    --gold:#C9A24B;
    --surface:#FFFFFF;
    --line:#EBE1E4;
    --muted:#8A7B85;
    --ok:#2E7D5B;
    --busy:#B5482F;
    --wait:#8A6D1F;
    --radius:14px;
    --shadow:0 1px 2px rgba(36,24,35,.04), 0 8px 24px rgba(36,24,35,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Spectral',Georgia,serif;font-weight:500;letter-spacing:-.01em;margin:0}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}

  /* ---- shell ---- */
  .app{max-width:960px;margin:0 auto;padding:0 18px 120px}
  .topbar{
    position:sticky;top:0;z-index:40;background:rgba(250,246,244,.9);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 0;margin-bottom:20px;
  }
  .wordmark{font-family:'Spectral',serif;font-size:24px;font-weight:600;letter-spacing:-.02em;color:var(--plum);display:flex;align-items:baseline;gap:7px}
  .wordmark small{font-family:'Inter';font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
  .loc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
  .loc select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 8px;font-family:inherit;font-size:13px;color:var(--ink)}
  .bell{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:11px;width:40px;height:40px;font-size:18px;display:grid;place-items:center}
  .bell .dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--busy);color:#fff;font-size:11px;font-weight:700;font-family:'Inter';display:grid;place-items:center}

  /* ---- hero ---- */
  .hero{padding:8px 0 26px}
  .hero h1{font-size:clamp(30px,6vw,46px);line-height:1.05;max-width:16ch}
  .hero p{color:var(--muted);max-width:52ch;margin:14px 0 0}
  .hero .stats{display:flex;gap:26px;margin-top:22px;flex-wrap:wrap}
  .hero .stats b{font-family:'Spectral';font-size:26px;font-weight:600;color:var(--plum);display:block}
  .hero .stats span{font-size:12px;color:var(--muted)}

  /* ---- nav tabs ---- */
  .tabs{display:flex;gap:6px;position:fixed;bottom:0;left:0;right:0;z-index:50;
    background:var(--surface);border-top:1px solid var(--line);padding:8px max(18px,calc((100vw - 960px)/2 + 18px));justify-content:space-between}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:600;
    display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:10px}
  .tabs button .ic{font-size:19px}
  .tabs button.on{color:var(--plum);background:#F6EEF3}

  /* ---- cards ---- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .salon .thumb{height:120px;background:linear-gradient(135deg,var(--plum),var(--plum-deep));position:relative;display:flex;align-items:flex-end;padding:12px}
  .salon .thumb .chain{color:#fff;font-family:'Spectral';font-size:19px}
  .salon .thumb .status{position:absolute;top:10px;right:10px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.92)}
  .status.open{color:var(--ok)} .status.busy{color:var(--busy)}
  .salon .body{padding:13px 14px 15px}
  .salon .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .salon .area{font-size:13px;color:var(--muted)}
  .salon .rate{font-weight:600;font-size:13px}
  .salon .rate .star{color:var(--gold)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .chip{font-size:11px;font-weight:600;color:var(--plum);background:#F6EEF3;border-radius:20px;padding:4px 9px}
  .queue{margin-top:12px;font-size:12px;color:var(--wait);display:flex;align-items:center;gap:6px;font-weight:600}
  .queue .pulse{width:8px;height:8px;border-radius:50%;background:var(--wait);box-shadow:0 0 0 0 rgba(138,109,31,.5);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(138,109,31,.45)}70%{box-shadow:0 0 0 7px rgba(138,109,31,0)}100%{box-shadow:0 0 0 0 rgba(138,109,31,0)}}

  .btn{border:0;border-radius:11px;padding:11px 16px;font-weight:600;font-size:14px;background:var(--plum);color:#fff;width:100%}
  .btn:hover{background:var(--plum-deep)}
  .btn.ghost{background:transparent;color:var(--plum);border:1px solid var(--line)}
  .btn.ghost:hover{background:#F6EEF3}
  .btn.gold{background:var(--gold);color:#3a2e08}
  .btn.sm{width:auto;padding:8px 13px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .sectionhead{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 14px}
  .sectionhead h2{font-size:22px}
  .sectionhead .link{font-size:13px;color:var(--plum);font-weight:600;border:0;background:0}

  /* ---- detail / booking ---- */
  .back{border:0;background:0;color:var(--muted);font-size:14px;font-weight:600;margin-bottom:14px;display:flex;gap:6px;align-items:center}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .svc{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
  .svc:last-child{border-bottom:0}
  .svc .meta small{color:var(--muted);font-size:12px}
  .svc .price{font-weight:600;margin-right:12px}
  .stylist{display:flex;gap:12px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:.15s}
  .stylist:hover{border-color:var(--plum)}
  .stylist.sel{border-color:var(--plum);background:#F6EEF3}
  .stylist .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#e6c877);display:grid;place-items:center;font-weight:700;color:#3a2e08}
  .stylist .name{font-weight:600}
  .stylist small{color:var(--muted)}
  .stylistgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  .dates{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .date{min-width:60px;text-align:center;border:1px solid var(--line);border-radius:11px;padding:9px 4px;cursor:pointer;flex-shrink:0}
  .date.sel{border-color:var(--plum);background:var(--plum);color:#fff}
  .date b{display:block;font-size:17px;font-family:'Spectral'}
  .date small{font-size:11px;opacity:.8}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:12px}
  .slot{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;font-size:13px;font-weight:600;background:var(--surface)}
  .slot.free{cursor:pointer}
  .slot.free:hover{border-color:var(--plum)}
  .slot.sel{background:var(--plum);color:#fff;border-color:var(--plum)}
  .slot.booked{background:#F3EEF0;color:#c3b6bd;cursor:not-allowed;text-decoration:line-through;position:relative}
  .slot.booked::after{content:"booked";position:absolute;bottom:-15px;left:0;right:0;font-size:9px;font-weight:600;color:#c3b6bd;text-decoration:none}
  .slotwrap{margin-bottom:14px}

  .stack>*+*{margin-top:10px}
  .listrow{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .listrow:last-child{border-bottom:0}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block}
  .tag.up{background:#EAF4EF;color:var(--ok)}
  .tag.wl{background:#FBF3DD;color:var(--wait)}
  .tag.done{background:#F0ECEE;color:var(--muted)}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px}
  .field input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;font-size:15px;background:var(--surface)}
  .field input:focus{outline:2px solid var(--plum);border-color:transparent}

  .noti{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .noti:last-child{border-bottom:0}
  .noti .ni{width:34px;height:34px;border-radius:10px;background:#F6EEF3;display:grid;place-items:center;font-size:16px;flex-shrink:0}
  .noti small{color:var(--muted);font-size:12px}
  .noti.unread{background:#FCF8F6;margin:0 -8px;padding:13px 8px;border-radius:8px}

  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .big{font-size:34px;margin-bottom:8px}

  .toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;box-shadow:var(--shadow);z-index:80;opacity:0;transition:.3s;pointer-events:none;max-width:90vw}
  .toast.show{opacity:1}

  .banner{background:#F6EEF3;border:1px solid #E7D6E1;border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--plum);margin-bottom:18px}
  .waitcard{background:linear-gradient(135deg,var(--plum),var(--plum-deep));color:#fff;border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:14px}
  .waitcard .pos{font-family:'Spectral';font-size:48px;font-weight:600;line-height:1}
  .waitcard small{opacity:.85;display:block;margin-top:4px}
  /* ---- token queue ---- */
  .qhero{background:linear-gradient(135deg,var(--plum),var(--plum-deep));color:#fff;border-radius:var(--radius);padding:26px 20px;text-align:center;margin-bottom:16px}
  .qhero .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
  .qhero .tok{font-family:'Spectral';font-size:58px;font-weight:600;line-height:1;margin:6px 0}
  .qhero .sub{opacity:.9;font-size:13px}
  .qline{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;margin-bottom:8px;background:var(--surface)}
  .qline:last-child{margin-bottom:0}
  .qline .qt{font-family:'Spectral';font-weight:600;font-size:16px;width:54px;flex-shrink:0}
  .qline.served{opacity:.45}
  .qline.now{border-color:var(--plum);background:#F6EEF3}
  .qline.now .qt{color:var(--plum)}
  .qline.you{border-color:var(--gold);background:#FBF3DD}
  .qline .qs{font-size:11px;font-weight:700;margin-left:auto;padding:3px 8px;border-radius:20px;background:#F0ECEE;color:var(--muted);flex-shrink:0}
  .qline.now .qs{background:var(--plum);color:#fff}
  .qline.you .qs{background:var(--gold);color:#3a2e08}
  .turnmodal .tok{font-family:'Spectral';font-size:54px;color:var(--plum);font-weight:600;text-align:center;line-height:1;margin:8px 0}
  /* ---- offers, trust, cart, reviews (Luzo-inspired) ---- */
  .offbadge{background:var(--gold);color:#3a2e08;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:.02em}
  .offbadge.big{font-size:11px;padding:4px 8px}
  .vbadge{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;color:#1f6b52;background:#E7F3EE;padding:3px 7px;border-radius:6px}
  .luxe{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--gold);border:1px solid var(--gold);padding:2px 6px;border-radius:6px;text-transform:uppercase}
  .thumb .badges{position:absolute;top:10px;left:10px;display:flex;gap:6px}
  .mrp{color:var(--muted);text-decoration:line-through;font-size:12px;margin-right:5px;font-weight:400}
  .heart{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.92);border:0;border-radius:50%;width:32px;height:32px;font-size:15px;display:grid;place-items:center;cursor:pointer}
  .status.mid{right:48px}
  .trustrow{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
  .trust{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);font-weight:600}
  .trust .ti{color:var(--ok)}
  .addbtn{border:1px solid var(--plum);background:transparent;color:var(--plum);border-radius:10px;padding:8px 15px;font-weight:600;font-size:13px}
  .addbtn.added{background:var(--plum);color:#fff}
  .cartbar{position:fixed;left:50%;transform:translateX(-50%);bottom:74px;z-index:60;background:var(--plum);color:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(63,27,55,.4);display:flex;align-items:center;gap:16px;padding:12px 16px;width:min(920px,calc(100% - 36px))}
  .cartbar .ct{font-weight:700}
  .cartbar small{opacity:.85;display:block;font-weight:400;font-size:12px}
  .cartbar .save{margin-left:auto;background:var(--gold);color:#3a2e08;font-weight:800;font-size:12px;padding:3px 8px;border-radius:6px}
  .cartbar button{background:#fff;color:var(--plum);border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
  .review{padding:12px 0;border-bottom:1px solid var(--line)}
  .review:last-child{border-bottom:0}
  .review .rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .review .who{font-weight:600;font-size:13px}
  .review .stars{color:var(--gold);font-size:12px}
  .review p{margin:0;font-size:13px;color:#5a4d54}
  .sortrow{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
  .sortchip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap;cursor:pointer}
  .sortchip.on{border-color:var(--plum);background:#F6EEF3;color:var(--plum)}
  .hidden{display:none !important}
  .modalbg{position:fixed;inset:0;background:rgba(36,24,35,.45);z-index:90;display:grid;place-items:center;padding:20px}
  .modal{background:var(--surface);border-radius:16px;max-width:400px;width:100%;padding:24px;box-shadow:var(--shadow)}
  .modal h3{font-size:20px;margin-bottom:6px}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="wordmark">Tresa<small>HYD</small></div>
    <div style="display:flex;align-items:center;gap:10px">
      <div class="loc">
        <span>📍</span>
        <select id="areaSel" onchange="App.setArea(this.value)"></select>
      </div>
      <button class="bell" onclick="App.go('noti')">🔔<span class="dot hidden" id="notiDot">0</span></button>
    </div>
  </div>

  <div id="view"></div>
</div>

<nav class="tabs">
  <button data-tab="home" class="on" onclick="App.go('home')"><span class="ic">🏠</span>Discover</button>
  <button data-tab="bookings" onclick="App.go('bookings')"><span class="ic">📅</span>Bookings</button>
  <button data-tab="noti" onclick="App.go('noti')"><span class="ic">🔔</span>Alerts</button>
  <button data-tab="profile" onclick="App.go('profile')"><span class="ic">👤</span>Profile</button>
</nav>

<div class="toast" id="toast"></div>
<div id="modalMount"></div>

<script>
/* ============================================================
   Tresa — Hyderabad salon & spa booking (prototype)
   Single-file demo. Data persists via window.storage when
   available, falling back to in-memory so it always runs.
   ============================================================ */

/* ---------- storage layer (safe) ---------- */
const mem = {};
const Store = {
  async get(k){
    try{ if(window.storage){ const r = await window.storage.get(k); return r? JSON.parse(r.value): null; } }catch(e){}
    return k in mem ? mem[k] : null;
  },
  async set(k,v){
    mem[k]=v;
    try{ if(window.storage){ await window.storage.set(k, JSON.stringify(v)); } }catch(e){}
  }
};

/* ---------- seed data (illustrative Hyderabad franchises) ---------- */
const AREAS = ["Banjara Hills","Jubilee Hills","Gachibowli","Madhapur","Kondapur","Kukatpally","Secunderabad"];

const SERVICE_MENU = {
  "Hair": [
    {n:"Haircut & styling", d:"45 min", p:600, off:0},
    {n:"Hair spa (deep conditioning)", d:"60 min", p:1200, off:20},
    {n:"Global colour", d:"120 min", p:3500, off:30},
    {n:"Keratin / smoothening", d:"180 min", p:5500, off:25},
  ],
  "Facial spa": [
    {n:"Hydra glow facial", d:"60 min", p:1800, off:40},
    {n:"O3+ brightening facial", d:"75 min", p:2400, off:20},
    {n:"De-tan clean-up", d:"40 min", p:900, off:0},
  ],
  "Leg spa": [
    {n:"Classic leg spa", d:"45 min", p:1100, off:0},
    {n:"Aroma leg spa + reflexology", d:"60 min", p:1600, off:30},
    {n:"Pedicure + leg spa combo", d:"75 min", p:1900, off:15},
  ]
};

const STYLIST_POOL = [
  {n:"Farhan A.", s:"Hair · Colour specialist"},
  {n:"Divya R.", s:"Facial & skin"},
  {n:"Meghana K.", s:"Hair · Bridal"},
  {n:"Sana P.", s:"Spa & pedicure"},
  {n:"Rakesh V.", s:"Hair · Men's grooming"},
];

const TIME_SLOTS = ["10:00","11:00","12:00","13:00","15:00","16:00","17:00","18:00","19:00"];

// deterministic pseudo-random so booked slots stay stable per salon/stylist/date
function seeded(str){let h=0;for(let i=0;i<str.length;i++){h=(h*31+str.charCodeAt(i))>>>0;}return h;}
function isBooked(salonId,stylist,dateKey,slot){
  return seeded(salonId+"|"+stylist+"|"+dateKey+"|"+slot) % 10 < 3; // ~30% booked
}

const SALONS = [
  {id:"jh-bh", chain:"Jawed Habib", area:"Banjara Hills", rating:4.6, reviews:820, dist:1.2, waiting:3, tier:"Franchise", verified:true, topOff:30, luxe:true,
    revs:[{n:"Priya M.",r:5,t:"Booked in a minute and the stylist was exactly who I picked. No wait once my token was called."},{n:"Karthik",r:4,t:"Clean, on time, fair pricing. The queue tracker is genuinely useful."}]},
  {id:"nat-gb", chain:"Naturals", area:"Gachibowli", rating:4.4, reviews:610, dist:2.4, waiting:0, tier:"Franchise", verified:true, topOff:20, luxe:false,
    revs:[{n:"Sneha",r:4,t:"Walked in with no wait. Facial was great value with the offer applied."}]},
  {id:"enr-jh", chain:"Enrich", area:"Jubilee Hills", rating:4.7, reviews:1150, dist:1.8, waiting:5, tier:"Company-owned", verified:true, topOff:40, luxe:true,
    revs:[{n:"Aisha R.",r:5,t:"Premium feel, and I loved seeing the live token move on my phone while I grabbed a coffee."},{n:"Rohit",r:5,t:"Paid at the venue, no prepayment drama. Will rebook."}]},
  {id:"lak-md", chain:"Lakmé Salon", area:"Madhapur", rating:4.5, reviews:940, dist:3.1, waiting:2, tier:"Franchise", verified:true, topOff:25, luxe:false,
    revs:[{n:"Divya",r:4,t:"Transparent prices before booking. Got a solid discount on colour."}]},
  {id:"nat-kp", chain:"Naturals", area:"Kukatpally", rating:4.3, reviews:430, dist:5.6, waiting:0, tier:"Franchise", verified:true, topOff:15, luxe:false,
    revs:[{n:"Manish",r:4,t:"Convenient location, quick service, free to cancel when plans changed."}]},
  {id:"jh-sc", chain:"Jawed Habib", area:"Secunderabad", rating:4.2, reviews:380, dist:6.9, waiting:1, tier:"Franchise", verified:false, topOff:0, luxe:false,
    revs:[{n:"Sruthi",r:4,t:"Decent haircut, staff were friendly and it was easy to book ahead."}]},
];
function salonServices(id){ return ["Hair","Facial spa","Leg spa"]; }
function salonStylists(id){ const h=seeded(id); return STYLIST_POOL.filter((_,i)=> (h>>i)&1 || i<3).slice(0,4); }

/* ---------- app state ---------- */
const App = {
  state:{ tab:"home", area:"All areas", sort:"near", user:null, bookings:[], waitlist:[], notis:[], queues:{}, cart:{salonId:null,items:[]}, favs:[], draft:{} },

  async init(){
    this.state.user = await Store.get("user");
    this.state.bookings = (await Store.get("bookings"))||[];
    this.state.waitlist = (await Store.get("waitlist"))||[];
    this.state.queues = (await Store.get("queues"))|| {};
    SALONS.forEach(s=>{ if(!this.state.queues[s.id]){ const base=8+(seeded(s.id)%25); this.state.queues[s.id]={serving:base, issued:base+s.waiting}; } });
    this.state.notis = (await Store.get("notis"))|| this.seedNotis();
    this.state.favs = (await Store.get("favs"))|| [];
    const sel = document.getElementById("areaSel");
    sel.innerHTML = ['All areas',...AREAS].map(a=>`<option>${a}</option>`).join('');
    this.refreshBell();
    this.go("home");
    // simulate live activity (waitlist movement) while tab is open
    setInterval(()=>this.tick(), 7000);
  },

  seedNotis(){
    return [{t:"Welcome to Tresa",b:"Find and book premium salons across Hyderabad. Your bookings and waitlist live here.",time:"just now",read:false,ic:"👋"}];
  },

  async save(){ await Store.set("bookings",this.state.bookings); await Store.set("waitlist",this.state.waitlist); await Store.set("queues",this.state.queues); await Store.set("notis",this.state.notis); },

  fmtTok(n){ return 'T-'+String(n).padStart(2,'0'); },

  /* ---- offers, cart, favourites helpers ---- */
  netPrice(it){ return Math.round(it.p * (1 - (it.off||0)/100)); },
  cartTotals(items){
    let mrp=0, total=0;
    items.forEach(it=>{ mrp+=it.p; total+=this.netPrice(it); });
    return { mrp, total, saved: mrp-total };
  },
  svcSummary(items){ return items.length===1 ? items[0].n : `${items[0].n} +${items.length-1} more`; },
  inCart(cat,n){ return this.state.cart.items.some(i=>i.n===n && i.cat===cat); },
  toggleCart(salonId,cat,n,p,off,d){
    const c=this.state.cart;
    if(c.salonId && c.salonId!==salonId){ c.items=[]; } // one salon per cart
    c.salonId=salonId;
    const i=c.items.findIndex(x=>x.n===n && x.cat===cat);
    if(i>=0){ c.items.splice(i,1); if(!c.items.length)c.salonId=null; }
    else{ c.items.push({cat,n,p,off:off||0,d}); }
    this.render();
  },
  clearCart(){ this.state.cart={salonId:null,items:[]}; },
  toggleFav(id){ const f=this.state.favs; const i=f.indexOf(id); if(i>=0)f.splice(i,1); else f.push(id); Store.set('favs',f); this.render(); },
  setSort(s){ this.state.sort=s; this.render(); },

  setArea(a){ this.state.area=a; if(this.state.tab==="home") this.render(); },

  go(tab){
    this.state.tab=tab;
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
    if(tab==='noti'){ this.state.notis.forEach(n=>n.read=true); this.save(); this.refreshBell(); }
    this.render();
    window.scrollTo(0,0);
  },

  refreshBell(){
    const un = this.state.notis.filter(n=>!n.read).length;
    const dot=document.getElementById('notiDot');
    if(un>0){dot.textContent=un;dot.classList.remove('hidden');}else{dot.classList.add('hidden');}
  },

  toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(this._tt); this._tt=setTimeout(()=>t.classList.remove('show'),2600); },

  pushNoti(ic,title,body){
    this.state.notis.unshift({t:title,b:body,time:"just now",read:false,ic});
    this.save(); this.refreshBell();
  },

  // simulate the queue advancing even without user action
  tick(){
    const active = Object.keys(this.state.queues).filter(id=>this.state.queues[id].serving < this.state.queues[id].issued);
    if(!active.length) return;
    // prefer salons where the user is actually waiting, so their turn arrives
    const mineActive = active.filter(id=>this.state.waitlist.some(w=>w.salonId===id));
    const pool = mineActive.length ? mineActive : active;
    const id = pool[Math.floor(Math.random()*pool.length)];
    const q = this.state.queues[id]; q.serving++;
    // notify any of the user's tokens at this salon
    this.state.waitlist.filter(w=>w.salonId===id).forEach(w=>{
      const ahead = w.token - q.serving;
      if(ahead===1 && !w.nextAlert){ w.nextAlert=true;
        this.pushNoti("⏳","You're next",`One person ahead of you at ${w.chain}, ${w.area}. Head over — your token is ${this.fmtTok(w.token)}.`); }
      if(ahead<=0 && !w.turnAlert){ w.turnAlert=true;
        this.pushNoti("🔔","It's your turn!",`Token ${this.fmtTok(w.token)} is now being served at ${w.chain}, ${w.area}. Please proceed to reception.`);
        this.turnAlert(w); }
    });
    this.save();
    if(['home','bookings','queue'].includes(this.state.tab)) this.render();
  },

  turnAlert(w){
    this.modal(`<div class="turnmodal">
      <div style="text-align:center;font-size:36px">🔔</div>
      <h3 style="text-align:center">It's your turn!</h3>
      <div class="tok">${this.fmtTok(w.token)}</div>
      <p style="text-align:center;color:var(--muted);margin:2px 0 18px">Now being served at ${w.chain}, ${w.area}.<br>Please proceed to reception.</p>
      <button class="btn" onclick="App.ackTurn('${w.id}')">I'm on my way</button>
    </div>`);
  },
  async ackTurn(id){ this.state.waitlist=this.state.waitlist.filter(w=>w.id!==id); await this.save(); this.closeModal(); this.toast('Enjoy your service ✨'); this.refreshBell(); this.render(); },

    const t=this.cartTotals(c.items);

      <div><div class="ct">${c.items.length} service${c.items.length>1?'s':''} · ₹${t.total}</div>
        <small>${this.svcSummary(c.items)}</small></div>

      <button onclick="App.startCheckout('${salonId}')">Book now →</button>
    </div>`;
  },

    if(!c.items.length) return;
    this.state.draft={ salonId, items:c.items.map(i=>({...i})), stylist:null, dateKey:null, slot:null };

  },

      const cls = booked?'booked':(d.slot===sl?'sel':'free');
      return `<div class="slot ${cls}" ${booked?'':`onclick="App.pickSlot('${sl}')"`}>${sl}</div>`;
    }).join('');
    const allBooked = d.stylist && d.stylist!=="Any available" && TIME_SLOTS.every(sl=>isBooked(d.salonId,chosenStylist,d.dateKey,sl));

    const items = d.items || [];
    const t = this.cartTotals(items);
    return `
      <button class="back" onclick="App.go('salon')">← ${s.chain}, ${s.area}</button>

          <div class="meta"><div style="font-weight:500">${it.n} ${it.off>0?`<span class="offbadge">${it.off}% OFF</span>`:''}</div><small>${it.cat} · ${it.d}</small></div>

        <div class="stylistgrid">
          ${stylists.map(st=>`
            <div class="stylist ${chosenStylist===st.n?'sel':''}" onclick="App.pickStylist('${st.n.replace(/'/g,"")}')">
              <div class="av">${st.n==="Any available"?"✳":st.n[0]}</div>
              <div><div class="name">${st.n}</div><small>${st.s}</small></div>
            </div>`).join('')}
        </div>

      <div class="panel">
        <h3 style="font-size:16px;margin-bottom:12px">Pick a date <span style="font-weight:400;color:var(--muted);font-size:13px">— advance booking up to a week</span></h3>
        <div class="dates">
          ${days.map(dy=>`<div class="date ${d.dateKey===dy.key?'sel':''}" onclick="App.pickDate('${dy.key}')">
            <small>${dy.i===0?'Today':dy.dow}</small><b>${dy.dnum}</b></div>`).join('')}
        </div>
        <div class="slotwrap" style="margin-top:18px">
          ${d.stylist && d.stylist!=="Any available" ? `<div class="area" style="margin-bottom:6px;font-size:12.5px">Greyed slots are already booked with ${chosenStylist}.</div>`:''}
          <div class="slots">${slotsHtml}</div>

          <div class="waitcard" style="margin-top:22px">

          </div>`:`
          <button class="btn" style="margin-top:22px" ${d.slot?'':'disabled'} onclick="App.confirmBooking()">
            ${d.slot?`Confirm · pay ₹${t.total} at venue · ${d.slot}`:'Select a time to continue'}
          </button>
          <button class="btn ghost" style="margin-top:10px" onclick="App.joinWaitlist()">Slot you want not free? Join waitlist instead</button>`}

  },

  pickStylist(n){ this.state.draft.stylist=n; this.state.draft.slot=null; this.render(); },
  pickDate(k){ this.state.draft.dateKey=k; this.state.draft.slot=null; this.render(); },
  pickSlot(sl){ this.state.draft.slot=sl; this.render(); },

  requireUser(next){
    if(this.state.user){ next(); return; }
    this.modal(`
      <h3>Quick — who's booking?</h3>
      <p style="color:var(--muted);margin:0 0 16px">We save this so you don't re-enter it each time.</p>
      <div class="field"><label>Full name</label><input id="mName" placeholder="e.g. Aarav Sharma"/></div>
      <div class="field"><label>Mobile</label><input id="mPhone" placeholder="10-digit mobile"/></div>
      <button class="btn" onclick="App.saveUserThen()">Save &amp; continue</button>
    `);
    this._pendingNext=next;
  },
  async saveUserThen(){
    const name=document.getElementById('mName').value.trim();
    const phone=document.getElementById('mPhone').value.trim();
    if(!name||phone.length<10){ this.toast('Enter a name and a valid mobile'); return; }
    this.state.user={name,phone}; await Store.set('user',this.state.user);
    this.closeModal(); const n=this._pendingNext; this._pendingNext=null; if(n)n();
  },

  confirmBooking(){
    this.requireUser(async ()=>{
      const d=this.state.draft;const s=SALONS.find(x=>x.id===d.salonId);
      const items=d.items||[]; const t=this.cartTotals(items);
      this.state.bookings.unshift({
        id:'b'+Date.now(), chain:s.chain, area:s.area, services:items.map(i=>i.n), summary:this.svcSummary(items),
        stylist:d.stylist||"Any available", date:d.dateKey, slot:d.slot, total:t.total, saved:t.saved, status:'upcoming'
      });
      await this.save();
      this.pushNoti("✅","Booking confirmed",`${this.svcSummary(items)} at ${s.chain}, ${s.area} — ${this.fmtDate(d.dateKey)} at ${d.slot}. Pay ₹${t.total} at the venue.`);
      this.clearCart();
      this.toast('Booked! See it under Bookings');
      this.go('bookings');
    });
  },

  joinWaitlist(){
    this.requireUser(async ()=>{
      const d=this.state.draft;const s=SALONS.find(x=>x.id===d.salonId);
      const items=d.items||[]; const summary = items.length? this.svcSummary(items) : (d.svc||'Next available service');
      const q = this.state.queues[d.salonId] || (this.state.queues[d.salonId]={serving:1,issued:1});
      q.issued += 1;
      const token = q.issued;
      const ahead = Math.max(0, token - q.serving);
      this.state.waitlist.unshift({
        id:'w'+Date.now(), salonId:d.salonId, chain:s.chain, area:s.area,
        service:summary, stylist:d.stylist||"Any available", date:d.dateKey, token, nextAlert:false, turnAlert:false
      });
      await this.save();
      this.pushNoti("🎫","Token issued",`Your token is ${this.fmtTok(token)} at ${s.chain}, ${s.area}. ${ahead} ahead of you — we'll alert you when your turn comes.`);
      this.clearCart();
      this.toast(`Token ${this.fmtTok(token)} · ${ahead} ahead`);
      this.openQueue(d.salonId);
    });
  },

  // any user "booking" a busy salon can grab a token for the next chair
  takeToken(id){
    this.state.draft={ salonId:id, items:[], svc:'Next available service', stylist:'Any available', dateKey:new Date().toISOString().slice(0,10) };
    this.joinWaitlist();
  },
  openQueue(id){ this.state.draft={...this.state.draft, salonId:id}; this.go('queue'); },

  vQueue(){
    const id=this.state.draft.salonId; const s=SALONS.find(x=>x.id===id);
    const q=this.state.queues[id]||{serving:1,issued:1};
    const mine=this.state.waitlist.filter(w=>w.salonId===id);
    const myTokens=mine.map(w=>w.token);
    const primary = mine.length ? mine.reduce((a,b)=>a.token<b.token?a:b) : null;
    const ahead = primary ? Math.max(0, primary.token - q.serving) : 0;
    const from=Math.max(1,q.serving-2); const rows=[];
    for(let t=from;t<=Math.max(q.issued,q.serving);t++){
      const isYou=myTokens.includes(t);
      const cls = t<q.serving?'served': t===q.serving?'now': isYou?'you':'';
      const label = t<q.serving?'Done': t===q.serving?'Now serving': isYou?'You':'Waiting';
      const who = isYou ? mine.find(w=>w.token===t).service : 'Guest';
      rows.push(`<div class="qline ${cls}"><span class="qt">${this.fmtTok(t)}</span><span>${who}</span><span class="qs">${label}</span></div>`);
    }
    return `
      <button class="back" onclick="App.openSalon('${id}')">← ${s.chain}, ${s.area}</button>
      ${primary?`<div class="qhero">
        <div class="lab">Your token</div>
        <div class="tok">${this.fmtTok(primary.token)}</div>
        <div class="sub">${ahead===0?'You are being served now':ahead===1?"You're next — one person ahead":ahead+' people ahead · approx '+ahead*20+' min wait'}</div>
      </div>`:`<div class="qhero">
        <div class="lab">Now serving</div>
        <div class="tok">${this.fmtTok(q.serving)}</div>
        <div class="sub">${Math.max(0,q.issued-q.serving)} in the queue right now</div>
      </div>`}
      <div class="panel">
        <div class="sectionhead" style="margin:0 0 12px"><h2 style="font-size:18px">Live queue</h2>
          <span style="color:var(--muted);font-size:12px;font-weight:600">Now serving ${this.fmtTok(q.serving)}</span></div>
        ${rows.join('')}
      </div>
      ${primary
        ? `<button class="btn ghost" onclick="App.leaveWait('${primary.id}')">Leave the queue</button>`
        : `<button class="btn" onclick="App.takeToken('${id}')">Take a token &amp; join the queue</button>`}
      <div class="banner" style="margin-top:16px">The queue advances live while this tab is open, and you'll get an alert the moment your token is called.</div>
    `;
  },

  vBookings(){
    const up=this.state.bookings.filter(b=>b.status==='upcoming');
    const wl=this.state.waitlist;
    const past=this.state.bookings.filter(b=>b.status!=='upcoming');
    if(!up.length && !wl.length && !past.length){
      return `<div class="empty"><div class="big">📅</div><h3 style="font-size:20px;color:var(--ink)">Nothing booked yet</h3><p>Find a salon to make your first booking.</p><button class="btn sm" style="margin-top:14px;display:inline-block" onclick="App.go('home')">Discover salons</button></div>`;
    }
    return `
      <div class="sectionhead"><h2>Your bookings</h2></div>
      ${wl.length?`<div class="panel"><h3 style="font-size:16px;margin-bottom:4px">In the queue · your tokens</h3>
        <div class="stack" style="margin-top:8px">${wl.map(w=>this.waitRow(w)).join('')}</div></div>`:''}
      ${up.length?`<div class="panel"><h3 style="font-size:16px;margin-bottom:4px">Upcoming</h3>
        <div>${up.map(b=>this.bookRow(b)).join('')}</div></div>`:''}
      ${past.length?`<div class="panel"><h3 style="font-size:16px;margin-bottom:4px">Past</h3>
        <div>${past.map(b=>this.bookRow(b)).join('')}</div></div>`:''}
    `;
  },
  bookRow(b){
    return `<div class="listrow">
      <div><div style="font-weight:600">${b.summary||b.service||'Service'}</div>
        <small style="color:var(--muted)">${b.chain}, ${b.area} · ${b.stylist}</small><br>
        <small style="color:var(--muted)">${this.fmtDate(b.date)} · ${b.slot||''}</small>
        ${b.status==='upcoming'?`<br><small style="color:var(--ok);font-weight:600">Pay at venue</small>`:''}</div>
      <div style="text-align:right">
        <span class="tag ${b.status==='upcoming'?'up':'done'}">${b.status==='upcoming'?'Upcoming':'Completed'}</span>
        <div style="font-weight:600;margin-top:6px">₹${b.total!=null?b.total:b.price||0}</div>
        ${b.saved>0?`<div class="offbadge" style="margin-top:4px">saved ₹${b.saved}</div>`:''}
        ${b.status==='upcoming'?`<button class="btn ghost sm" style="margin-top:6px" onclick="App.cancelBooking('${b.id}')">Cancel</button>`:''}
      </div>
    </div>`;
  },
  waitRow(w){
    const q=this.state.queues[w.salonId]||{serving:1,issued:1};
    const ahead=Math.max(0,w.token-q.serving);
    return `<div class="listrow">
      <div><div style="font-weight:600">${this.fmtTok(w.token)} · ${w.service}</div>
        <small style="color:var(--muted)">${w.chain}, ${w.area} · ${w.stylist}</small><br>
        <small style="color:var(--muted)">Now serving ${this.fmtTok(q.serving)} · ${ahead===0?'your turn now':ahead+' ahead'}</small></div>
      <div style="text-align:right">
        <span class="tag wl">${ahead===0?'Your turn':'#'+ahead+' in queue'}</span>
        <div style="display:flex;gap:6px;margin-top:8px;justify-content:flex-end">
          <button class="btn ghost sm" onclick="App.openQueue('${w.salonId}')">Queue</button>
          <button class="btn ghost sm" onclick="App.leaveWait('${w.id}')">Leave</button>
        </div>
      </div>
    </div>`;
  },
  async cancelBooking(id){ this.state.bookings=this.state.bookings.filter(b=>b.id!==id); await this.save(); this.toast('Booking cancelled'); this.render(); },
  async leaveWait(id){ this.state.waitlist=this.state.waitlist.filter(w=>w.id!==id); await this.save(); this.toast('Left the waitlist'); this.render(); },

  vNoti(){
    if(!this.state.notis.length) return `<div class="empty"><div class="big">🔔</div>No alerts yet.</div>`;
    return `<div class="sectionhead"><h2>Alerts</h2></div>
      <div class="panel">${this.state.notis.map(n=>`
        <div class="noti"><div class="ni">${n.ic}</div>
          <div><div style="font-weight:600">${n.t}</div><small>${n.b}</small><br><small style="opacity:.7">${n.time}</small></div>
        </div>`).join('')}</div>
      <div class="banner">In this prototype, alerts update live while the tab is open. True background/offline push (SMS + web push) needs the backend described in the build plan.</div>`;
  },

  vProfile(){
    const u=this.state.user;
    return `<div class="sectionhead"><h2>Profile</h2></div>
      <div class="panel">
        <div class="field"><label>Full name</label><input id="pName" value="${u?u.name:''}" placeholder="Your name"/></div>
        <div class="field"><label>Mobile</label><input id="pPhone" value="${u?u.phone:''}" placeholder="10-digit mobile"/></div>
        <button class="btn" onclick="App.saveProfile()">Save details</button>
        <p style="color:var(--muted);font-size:12.5px;margin:12px 0 0">Stored on this device via the app's storage layer. In production this lives in your account, secured with OTP login.</p>
      </div>
      <div class="panel">
        <h3 style="font-size:16px;margin-bottom:8px">Your activity</h3>
        <div class="listrow"><span>Total bookings</span><b>${this.state.bookings.length}</b></div>
        <div class="listrow"><span>On waitlists</span><b>${this.state.waitlist.length}</b></div>
        <div class="listrow" style="border:0"><span>Preferred area</span><b>${this.state.area}</b></div>
      </div>`;
  },
  async saveProfile(){
    const name=document.getElementById('pName').value.trim();
    const phone=document.getElementById('pPhone').value.trim();
    if(!name||phone.length<10){this.toast('Enter a name and valid mobile');return;}
    this.state.user={name,phone}; await Store.set('user',this.state.user); this.toast('Profile saved');
  },

  fmtDate(k){ const d=new Date(k); const t=new Date(); 
    if(k===t.toISOString().slice(0,10))return 'Today';
    return d.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}); },

  modal(html){ document.getElementById('modalMount').innerHTML=`<div class="modalbg" onclick="if(event.target===this)App.closeModal()"><div class="modal">${html}</div></div>`; },
  closeModal(){ document.getElementById('modalMount').innerHTML=''; }
};

App.init();
</script>
</body>
</html>
